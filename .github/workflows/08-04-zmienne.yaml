name: "08-04 Pogoda API - Variables"

on:
  push:
    branches:
      - feature/06-pogoda-api

  pull_request:
    branches:
      - feature/06-pogoda-api

  workflow_dispatch:

env:
  WORKDIR: ${{ vars.WORKDIR }}

  TEST_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}
  HUB_IMAGE_BASE: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_IMAGE_NAME }}

  DOCKERHUB_TAG: ${{ vars.DOCKERHUB_TAG }}
  DOCKER_PORT_EXTERNAL: ${{ vars.DOCKER_PORT_EXTERNAL }}
  DEPLOY_CONTAINER_NAME: ${{ vars.DEPLOY_CONTAINER_NAME }}
  WEATHER_CITY: ${{ vars.WEATHER_CITY }}

  CONFIG_SCOPE: workflow

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workflow scope
        run: echo "$CONFIG_SCOPE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}
          load: true
          push: false

      - name: Save image to tar
        run: |
          docker save \
            "${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}" \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogoda-image
          path: image.tar

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: pogoda-image

      - name: Load Docker image
        run: |
          docker load -i image.tar

      - name: Run container
        run: |
          docker run -d \
            --name pogoda_api \
            -p 8000:8000 \
            -e OPENWEATHER_API_KEY="${{ secrets.OPENWEATHER_API_KEY }}" \
            "${{ env.TEST_IMAGE }}:${{ env.DOCKERHUB_TAG }}"

      - name: Wait for API
        run: |
          sleep 10

      - name: Test /weather endpoint
        run: |
          curl --fail --silent --show-error \
            --get \
            --data-urlencode "city=$WEATHER_CITY" \
            http://localhost:8000/weather

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs pogoda_api || true

      - name: Stop container
        if: always()
        run: |
          docker stop pogoda_api || true
          docker rm pogoda_api || true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    if: |
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref_name == vars.DEPLOY_BRANCH

    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:${{ env.DOCKERHUB_TAG }}
            ${{ env.HUB_IMAGE_BASE }}:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, linux]
    needs: build-and-push

    timeout-minutes: 5

    concurrency:
      group: pogoda-api-variables-deploy
      cancel-in-progress: false

    env:
      IMAGE_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
      CONFIG_SCOPE: job

    steps:
      - name: Print step scope
        env:
          CONFIG_SCOPE: step
        run: |
          echo "$CONFIG_SCOPE"

      - name: Print job scope
        run: |
          echo "$CONFIG_SCOPE"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate configuration
        run: |
          test -n "$DEPLOY_CONTAINER_NAME" || { echo "DEPLOY_CONTAINER_NAME missing"; exit 1; }
          test -n "$DOCKER_PORT_EXTERNAL" || { echo "DOCKER_PORT_EXTERNAL missing"; exit 1; }
          test -n "$DOCKERHUB_TAG" || { echo "DOCKERHUB_TAG missing"; exit 1; }
          test -n "$WEATHER_CITY" || { echo "WEATHER_CITY missing"; exit 1; }
          test -n "$IMAGE_DIGEST" || { echo "IMAGE_DIGEST missing"; exit 1; }

          echo "Image: $HUB_IMAGE_BASE"
          echo "Tag: $DOCKERHUB_TAG"
          echo "Port: $DOCKER_PORT_EXTERNAL"
          echo "Container: $DEPLOY_CONTAINER_NAME"
          echo "City: $WEATHER_CITY"

      - name: Create API_BASE_URL
        run: |
          echo "API_BASE_URL=http://127.0.0.1:${DOCKER_PORT_EXTERNAL}" >> $GITHUB_ENV

      - name: Pull image by digest
        run: |
          docker pull "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Remove previous container
        run: |
          existing_container="$(docker container ls --all --quiet --filter "name=^/${DEPLOY_CONTAINER_NAME}$")"

          if [ -n "$existing_container" ]; then
            docker rm --force "$existing_container"
          fi

      - name: Run published container
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          docker run -d \
            --name "$DEPLOY_CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${DOCKER_PORT_EXTERNAL}:8000" \
            -e OPENWEATHER_API_KEY \
            "${HUB_IMAGE_BASE}@${IMAGE_DIGEST}"

      - name: Verify API readiness
        run: |
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --max-time 5 \
            --output /dev/null \
            "${API_BASE_URL}/openapi.json"

          test "$(docker inspect --format '{{.State.Running}}' "$DEPLOY_CONTAINER_NAME")" = true

      - name: Test deployed weather endpoint
        run: |
          curl --fail --silent --show-error \
            --get \
            --data-urlencode "city=$WEATHER_CITY" \
            "${API_BASE_URL}/weather"

      - name: Show logs on failure
        if: failure()
        run: |
          docker logs "$DEPLOY_CONTAINER_NAME" || true