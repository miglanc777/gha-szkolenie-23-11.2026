name: 04 - Docker Web CI - with actions

on:
  push:
    branches:
      - docker

  pull_request:
    branches:
      - docker

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02

    env:
      IMAGE_NAME: webapp
      TAG: ${{ github.sha }}
      HOST_PORT: 8080
      CONTAINER_PORT: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG }}

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Compose up
        uses: isbang/compose-action@v2
        with:
          compose-file: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02/docker-compose.yml
          down-flags: --volumes --remove-orphans

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:${HOST_PORT}/ > /dev/null; then
              echo "Application ready"
              exit 0
            fi
            sleep 1
          done

          echo "Application failed to start"
          exit 1

      - name: Test page content
        run: |
          BODY=$(curl -fsS http://localhost:${HOST_PORT}/)

          echo "$BODY"

          echo "$BODY" | grep -qi "szkolenie github"

      - name: Cleanup
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
