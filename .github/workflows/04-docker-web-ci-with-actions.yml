name: 04 - Docker Web CI - with actions

on:
  push:
    branches:
      - docker

  pull_request:
    branches:
      - docker

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02

    env:
      IMAGE_NAME: webapp
      TAG: ${{ github.sha }}
      HOST_PORT: 8080
      CONTAINER_PORT: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.TAG }}

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}

      - name: Compose up
        uses: isbang/compose-action@v2
        with:
          compose-file: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02/docker-compose.yml
          down-flags: --volumes --remove-orphans

      - name: URL Health Check
        uses: jtalk/url-health-check-action@v3
        with:
          url: http://localhost:${{ env.HOST_PORT }}/
          max-attempts: 30
          retry-delay: 1s
          follow-redirect: false
      
      - name: GET /
        id: page
        uses: Satak/webrequest-action@v1.2.4
        with:
          url: http://localhost:${{ env.HOST_PORT }}/
          method: GET
      - name: Assert page contains expected text
        uses: actions/github-script@v7
        env:
          PAGE_BODY: ${{ steps.page.outputs.output }}
        with:
          script: |
            const body = process.env.PAGE_BODY || "";

            if (!body.includes("cw04 github actions")) {
              core.setFailed(
                'Strona nie zawiera oczekiwanego napisu: "cw04 github actions".'
              );
            }

      - name: Test page content
        run: |
          BODY=$(curl -fsS http://localhost:${HOST_PORT}/)

          echo "$BODY"

          echo "$BODY" | grep -qi "szkolenie github"

      - name: Docker logs (always)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            try {
              const logs = execSync('docker logs webapp', {
                encoding: 'utf8'
              });

              core.info('===== CONTAINER LOGS =====');
              core.info(logs);
            } catch (error) {
              core.warning(`Nie udało się pobrać logów kontenera: ${error.message}`);
            }
      
      - name: Compose down (always)
        if: always()
        uses: isbang/compose-action@v2
        with:
          compose-file: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02/docker-compose.yml
          commands: down --volumes --remove-orphans
