name: Pobierz pogodę

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Nazwa miasta"
        required: true
        default: "Warsaw"
        type: string

env:
  MY_KLUCZYK: ${{ vars.MY_KLUCZYK }}

jobs:
  pobierz-pogode:
    name: Pobierz informacje o pogodzie
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./CWICZENIA/06-context/pogoda

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v3

      - name: Pobierz dane pogodowe
        run: |
          chmod +x start.sh
          ./start.sh "${{ inputs.city }}" "${{ env.MY_KLUCZYK }}" >> "$GITHUB_STEP_SUMMARY"